  - generic [ref=e4]: 月K独立展示开仓前10个月至最终平仓后10个月的可用历史；月、周、日和15分钟K分别叠加 MA5/10/20/40，并使用图窗外历史预热，历史不足完整周期时均线留空，不用短样本冒充。周K、日K和15分钟K继续共用原交易日坐标。蓝线=开仓日，紫线=最终平仓日，淡黄色=持仓区间。15m窗口内的日K由同一批15m聚合；灰虚线表示精确合约缺历史数据后切到当日主力上下文。成交线只定位交易日，不伪造分钟成交时刻；若平仓日已切换上下文，则不把旧合约成交价画到代理K线上。
